# Stop secrets before they reach history (history secrets can only be rotated, not removed).
# Developers: pip install pre-commit && pre-commit install   (in each repository)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# Secrets and code weaknesses, with the rule pack and policy of the pull request scan, for the lines being
# committed only. Use it in place of the hook above. It needs OpenGrep and Gitleaks on PATH; see SDT's
