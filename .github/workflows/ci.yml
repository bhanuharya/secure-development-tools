name: ci

# Actions are pinned by full commit SHA (the repository's own `gha-pin-action/v1`
# transform policy); the trailing comment names the release the SHA resolves to.
# Scanner installs are pinned by release URL *and* verified against a recorded
# SHA-256, so a replaced upstream asset fails the job instead of running.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24.6"
  OPENGREP_VERSION: "1.29.0"
  OPENGREP_SHA256: "3365ef49d04893e01338d85d9bbd49b2bd5261ad4c9c0df0a6a0f8d44232ae13"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.73.0"
  TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"

jobs:
  go:
    name: go (format, vet, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        # First-party sources only: the vendored trees under rules/ keep upstream
        # bytes, and naming a directory that no longer exists makes gofmt exit 2.
        run: |
          dirs=""
          for d in cmd internal pkg; do [ -d "$d" ] && dirs="$dirs $d"; done
          if [ -z "$dirs" ]; then echo "no first-party Go directories found"; exit 1; fi
          unformatted="$(gofmt -l $dirs)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build -o sdt ./cmd/sdt
      - run: go test ./...

  rules:
    name: rule bundle (manifest hashes, validation, per-rule tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install pinned OpenGrep
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSLo /tmp/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -
          install -m 0755 /tmp/opengrep "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          "$HOME/.local/bin/opengrep" --version
      - run: go build -o sdt ./cmd/sdt
      - name: sdt rules verify
        run: ./sdt rules verify

  tools:
    name: offline tools (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: py_compile offline helpers
        run: python3 -m py_compile tools/*.py

  gate-smoke:
    name: engine blocks the vulnerable fixture, artifacts finalized
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install pinned scanners
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSLo /tmp/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -
          install -m 0755 /tmp/opengrep "$HOME/.local/bin/opengrep"

          curl -sSLo /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"

          curl -sSLo /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          install -m 0755 /tmp/trivy "$HOME/.local/bin/trivy"

          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: smoke test
        run: scripts/ci_gate_smoke.sh "$RUNNER_TEMP/sdt-smoke"
      - name: upload run artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sdt-smoke-reports
          path: ${{ runner.temp }}/sdt-smoke/reports/
          if-no-files-found: error
          retention-days: 14
