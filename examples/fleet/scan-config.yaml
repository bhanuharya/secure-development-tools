apiVersion: secure-dev/v1alpha1
kind: ScanConfiguration
metadata:
  name: fleet-advisory
project:
  root: .
profiles:
  full:
    mode: repository
    scanners: [opengrep, gitleaks, trivy-fs]
    requiredScanners: [opengrep, gitleaks, trivy-fs]
    timeout: 45m
    parallelism: 3
    missingHistory: fail
scanners:
  gitleaks:
    # The whole history of a large repository takes longer than the default 10 minutes.
    timeout: 30m
policy:
  behaviorOnRequiredScannerError: inconclusive
  defaultAction: report
