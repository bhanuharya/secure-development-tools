# Fact rules for Spring MVC controllers (Java).
#
# Fact rules are ordinary Opengrep rules whose id starts with "fact." and whose
# metadata.fact names the kind. They are NOT part of the scan rule pack: they
# live here so they never become scan findings and rules/manifest.yaml stays
# untouched. `sdt endpoints` runs only this directory.
#
# A class-level mapping and a class-level gate live directly in the class body;
# a method-level one lives inside a method. The resolver joins a method gate to
# a route by the handler declaration's end line (overloads share "Class.method",
# their bodies do not), so both rules carry that span.
rules:
  # Class-level @RequestMapping prefix. The pattern-not-inside clause keeps the
  # method-level mapping of the same annotation out (both are inside the class).
  - id: fact.java.class_prefix
    languages: [java]
    severity: INFO
    message: Spring class-level request mapping prefix
    metadata:
      fact: class_prefix
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          $RET $M(...) { ... }
      - pattern-either:
          - pattern: '@RequestMapping("$P")'
          - pattern: '@RequestMapping(value = "$P")'
          - pattern: '@RequestMapping(path = "$P")'

  # Shorthand method mappings: @GetMapping, @PostMapping, ...
  - id: fact.java.route
    languages: [java]
    severity: INFO
    message: Spring MVC shorthand method mapping
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @$VERB("$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @$VERB(value = "$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @$VERB(path = "$PATH")
              $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(Get|Post|Put|Patch|Delete)Mapping$

  # Bare method mapping: @PostMapping means the class prefix itself.
  - id: fact.java.route_bare
    languages: [java]
    severity: INFO
    message: Spring MVC method mapping without a path
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern: |
          @$VERB
          $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(Get|Post|Put|Patch|Delete)Mapping$

  # @RequestMapping with a verb: @RequestMapping(value = "/x", method = RequestMethod.POST).
  # Opengrep matches named annotation elements regardless of their order.
  - id: fact.java.request_route
    languages: [java]
    severity: INFO
    message: Spring MVC request mapping with an HTTP method
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @RequestMapping(value = "$PATH", method = RequestMethod.$VERB)
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(path = "$PATH", method = RequestMethod.$VERB)
              $RET $M(...) { ... }

  # @RequestMapping without a verb accepts every method (ANY).
  - id: fact.java.request_route_any
    languages: [java]
    severity: INFO
    message: Spring MVC request mapping without an HTTP method
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @RequestMapping("$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(value = "$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(path = "$PATH")
              $RET $M(...) { ... }

  # Security configuration: one access rule attached to a request matcher.
  # `... "$PATTERN" ...` enumerates every string argument, so a matcher with
  # several patterns yields one fact per pattern; focusing on $PATTERN gives
  # each fact the pattern's own column, which keeps chains in source order.
  - id: fact.java.security_matcher
    languages: [java]
    severity: INFO
    message: Spring Security request matcher and its access rule
    metadata:
      fact: security_matcher
    patterns:
      - pattern-either:
          - pattern: $CHAIN.$MATCHER(HttpMethod.$METHOD, ..., "$PATTERN", ...).$ACCESS($...ARGS)
          - pattern: $CHAIN.$MATCHER(..., "$PATTERN", ...).$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $MATCHER
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - focus-metavariable: $PATTERN

  # A simple string constant as a matcher path. The resolver substitutes the
  # value from fact.java.string_constant; an unresolved name makes the routes
  # it may affect unknown instead of dropping the rule.
  - id: fact.java.security_matcher_constant
    languages: [java]
    severity: INFO
    message: Spring Security request matcher with a constant path
    metadata:
      fact: security_matcher_expression
    patterns:
      - pattern-either:
          - pattern: $CHAIN.$MATCHER($PATTERN).$ACCESS($...ARGS)
          - pattern: $CHAIN.$MATCHER(HttpMethod.$METHOD, $PATTERN).$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $MATCHER
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - metavariable-regex:
          metavariable: $PATTERN
          regex: ^[A-Za-z_$][A-Za-z0-9_$]*(\.[A-Za-z_$][A-Za-z0-9_$]*)*$
      - focus-metavariable: $PATTERN

  # Any other matcher argument: a call or constructor is not a simple constant,
  # so the resolver marks the routes it may affect unknown.
  - id: fact.java.security_matcher_unknown
    languages: [java]
    severity: INFO
    message: Spring Security request matcher with an unreadable path
    metadata:
      fact: security_matcher_expression
    patterns:
      - pattern-either:
          - pattern: $CHAIN.$MATCHER(HttpMethod.$METHOD, ..., $PATTERN, ...).$ACCESS($...ARGS)
          - pattern: $CHAIN.$MATCHER(..., $PATTERN, ...).$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $MATCHER
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - metavariable-regex:
          metavariable: $PATTERN
          regex: ^(new\s+.+|[A-Za-z_$][A-Za-z0-9_$.]*\(.*\))$
      - focus-metavariable: $PATTERN

  # An access rule this resolver does not model: the matcher may be public,
  # role-protected or anything else, so its routes become unknown.
  - id: fact.java.security_matcher_unmodelled
    languages: [java]
    severity: INFO
    message: Spring Security request matcher with an unmodelled access rule
    metadata:
      fact: security_matcher_unmodelled
    patterns:
      - pattern-either:
          - pattern: $CHAIN.$MATCHER(HttpMethod.$METHOD, ..., "$PATTERN", ...).$ACCESS($...ARGS)
          - pattern: $CHAIN.$MATCHER(..., "$PATTERN", ...).$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $MATCHER
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      # A following matcher in a builder is not an access rule.
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(?!(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$).+
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).$ACCESS()
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).permitAll($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).authenticated($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).fullyAuthenticated($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).hasRole($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).hasAnyRole($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).hasAuthority($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).hasAnyAuthority($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).denyAll($...ARGS)
      - pattern-not: $CHAIN.$MATCHER(..., "$PATTERN", ...).access($...ARGS)
      - focus-metavariable: $PATTERN

  # Simple `static final String` constants. They are the only matcher or scope
  # arguments the resolver substitutes; anything else stays unknown.
  - id: fact.java.string_constant
    languages: [java]
    severity: INFO
    message: Java string constant
    metadata:
      fact: string_constant
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: static final String $NAME = "$VALUE";
          - pattern: $MOD static final String $NAME = "$VALUE";

  # One SecurityFilterChain bean. The span (first annotation to closing brace)
  # is what assigns the matcher and @Order facts of the same method to this
  # chain. A configure(HttpSecurity) in a SecurityConfigurerAdapter or
  # AbstractHttpConfigurer subclass only adds filters and is not here.
  # Beans often inject extra parameters, and WebFlux declares
  # SecurityWebFilterChain(ServerHttpSecurity); both still own their rules.
  - id: fact.java.security_chain
    languages: [java]
    severity: INFO
    message: Spring Security filter chain
    metadata:
      fact: security_chain
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              SecurityFilterChain $M(HttpSecurity $HTTP, ...) { ... }
          - pattern: |
              SecurityWebFilterChain $M(ServerHttpSecurity $HTTP, ...) { ... }

  # The legacy configure(HttpSecurity) chain of a web or resource-server
  # adapter. Only those two bases make configure a chain; a JWT configurer
  # extends SecurityConfigurerAdapter and is applied inside a real chain.
  - id: fact.java.security_chain_adapter
    languages: [java]
    severity: INFO
    message: Spring Security adapter filter chain
    metadata:
      fact: security_chain
    patterns:
      - pattern-inside: |
          class $C extends $BASE { ... }
      - metavariable-regex:
          metavariable: $BASE
          regex: ^(WebSecurityConfigurerAdapter|ResourceServerConfigurerAdapter)$
      - pattern: |
          $RET configure(HttpSecurity $HTTP) { ... }

  # A chain's @Order. Kept separate from the method pattern so the annotation
  # can sit before or after @Bean and still be read.
  - id: fact.java.security_order
    languages: [java]
    severity: INFO
    message: Spring Security filter chain order
    metadata:
      fact: security_order
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern: '@Order($ORDER)'

  # The request scope of one chain. $OWNER is the HttpSecurity variable (or
  # the requestMatchers() builder); the resolver only uses a scope whose owner
  # is the chain's own parameter, so requestMatchers() inside an authorize
  # lambda is a matcher, not a scope. The whole argument list is kept so
  # variadic patterns, OrRequestMatcher composites and simple constants can be
  # enumerated or rejected as unknown (T35 finding 6).
  - id: fact.java.security_scope
    languages: [java]
    severity: INFO
    message: Spring Security filter chain request matcher
    metadata:
      fact: security_scope
    patterns:
      - pattern: $OWNER.$SCOPE($...ARGS)
      - metavariable-regex:
          metavariable: $SCOPE
          regex: ^(securityMatcher|antMatcher|requestMatcher|requestMatchers|antMatchers|mvcMatchers|pathMatchers)$

  # Paths excluded from the security filter chain entirely. They are public by
  # design, so they must decide before any chain is selected. Unsupported
  # expressions keep their visible path/method bounds for route-local unknowns.
  - id: fact.java.security_ignored
    languages: [java]
    severity: INFO
    message: Spring Security ignored request matcher
    metadata:
      fact: security_ignored
    patterns:
      - pattern: $IGNORED.$IGNORE($...ARGS)
      - metavariable-regex:
          metavariable: $IGNORED
          regex: '[\s\S]*\.ignoring\(\)[\s\S]*'
      - metavariable-regex:
          metavariable: $IGNORE
          regex: ^(requestMatchers|antMatchers|mvcMatchers|pathMatchers)$
      - focus-metavariable: $IGNORE

  # Authentication mechanisms and filters of a chain. A chain without
  # authorization rules is public only when none of these is present.
  - id: fact.java.security_filter
    languages: [java]
    severity: INFO
    message: Spring Security authentication filter
    metadata:
      fact: security_filter
    patterns:
      - pattern: $HTTP.$FILTER_KIND($FILTER, ...)
      - metavariable-regex:
          metavariable: $FILTER_KIND
          regex: ^(addFilter|addFilterBefore|addFilterAfter|addFilterAt)$

  - id: fact.java.security_auth_mechanism
    languages: [java]
    severity: INFO
    message: Spring Security authentication mechanism
    metadata:
      fact: security_filter
    patterns:
      - pattern: $HTTP.$MECHANISM($...ARGS)
      - metavariable-regex:
          metavariable: $MECHANISM
          regex: ^(httpBasic|formLogin|oauth2Login|oauth2ResourceServer|x509|apply)$

  # The fallback of a chain: anyRequest() in the servlet DSL, anyExchange() in
  # WebFlux. Focus on the access call so the fact carries its own line.
  - id: fact.java.security_default
    languages: [java]
    severity: INFO
    message: Spring Security fallback access rule
    metadata:
      fact: security_default
    patterns:
      - pattern: $CHAIN.$DEFAULT().$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^(anyRequest|anyExchange)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - focus-metavariable: $ACCESS

  # Class-level method security. Spraying @PreAuthorize on a whole controller is
  # common, so the resolver applies it to every method without its own gate.
  - id: fact.java.class_gate
    languages: [java]
    severity: INFO
    message: Spring class-level method security annotation
    metadata:
      fact: class_gate
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          $RET $M(...) { ... }
      - pattern-either:
          - pattern: '@$ANNOTATION("$EXPR")'
          - pattern: '@$ANNOTATION($EXPR)'
      - metavariable-regex:
          metavariable: $ANNOTATION
          regex: ^(PreAuthorize|Secured|RolesAllowed)$

  # Method-level method security: @PreAuthorize("..."), @Secured(...),
  # @RolesAllowed(...). Roles come from the expression (resolve_spring.go).
  # The pattern includes the method body so the fact's end line identifies the
  # declaration and never leaks onto an overload with the same name.
  - id: fact.java.method_gate
    languages: [java]
    severity: INFO
    message: Spring method-level security annotation
    metadata:
      fact: method_gate
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @$ANNOTATION("$EXPR")
              $RET $M(...) { ... }
          - pattern: |
              @$ANNOTATION($EXPR)
              $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $ANNOTATION
          regex: ^(PreAuthorize|Secured|RolesAllowed)$
