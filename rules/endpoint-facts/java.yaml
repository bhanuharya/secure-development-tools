# Fact rules for Spring MVC controllers (Java).
#
# Fact rules are ordinary Opengrep rules whose id starts with "fact." and whose
# metadata.fact names the kind. They are NOT part of the scan rule pack: they
# live here so they never become scan findings and rules/manifest.yaml stays
# untouched. `sdt endpoints` runs only this directory.
#
# A class-level mapping and a class-level gate live directly in the class body;
# a method-level one lives inside a method. The resolver joins a method gate to
# a route by the handler declaration's end line (overloads share "Class.method",
# their bodies do not), so both rules carry that span.
rules:
  # Class-level @RequestMapping prefix. The pattern-not-inside clause keeps the
  # method-level mapping of the same annotation out (both are inside the class).
  - id: fact.java.class_prefix
    languages: [java]
    severity: INFO
    message: Spring class-level request mapping prefix
    metadata:
      fact: class_prefix
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          $RET $M(...) { ... }
      - pattern-either:
          - pattern: '@RequestMapping("$P")'
          - pattern: '@RequestMapping(value = "$P")'
          - pattern: '@RequestMapping(path = "$P")'

  # Shorthand method mappings: @GetMapping, @PostMapping, ...
  - id: fact.java.route
    languages: [java]
    severity: INFO
    message: Spring MVC shorthand method mapping
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @$VERB("$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @$VERB(value = "$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @$VERB(path = "$PATH")
              $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(Get|Post|Put|Patch|Delete)Mapping$

  # Bare method mapping: @PostMapping means the class prefix itself.
  - id: fact.java.route_bare
    languages: [java]
    severity: INFO
    message: Spring MVC method mapping without a path
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern: |
          @$VERB
          $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(Get|Post|Put|Patch|Delete)Mapping$

  # @RequestMapping with a verb: @RequestMapping(value = "/x", method = RequestMethod.POST).
  # Opengrep matches named annotation elements regardless of their order.
  - id: fact.java.request_route
    languages: [java]
    severity: INFO
    message: Spring MVC request mapping with an HTTP method
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @RequestMapping(value = "$PATH", method = RequestMethod.$VERB)
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(path = "$PATH", method = RequestMethod.$VERB)
              $RET $M(...) { ... }

  # @RequestMapping without a verb accepts every method (ANY).
  - id: fact.java.request_route_any
    languages: [java]
    severity: INFO
    message: Spring MVC request mapping without an HTTP method
    metadata:
      fact: route
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @RequestMapping("$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(value = "$PATH")
              $RET $M(...) { ... }
          - pattern: |
              @RequestMapping(path = "$PATH")
              $RET $M(...) { ... }

  # Security configuration: one access rule attached to a request matcher.
  # `... "$PATTERN" ...` enumerates every string argument, so a matcher with
  # several patterns yields one fact per pattern; focusing on $PATTERN gives
  # each fact the pattern's own column, which keeps chains in source order.
  - id: fact.java.security_matcher
    languages: [java]
    severity: INFO
    message: Spring Security request matcher and its access rule
    metadata:
      fact: security_matcher
    patterns:
      - pattern-either:
          - pattern: $CHAIN.$MATCHER(HttpMethod.$METHOD, ..., "$PATTERN", ...).$ACCESS($...ARGS)
          - pattern: $CHAIN.$MATCHER(..., "$PATTERN", ...).$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $MATCHER
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - focus-metavariable: $PATTERN

  # One SecurityFilterChain bean. The span (first annotation to closing brace)
  # is what assigns the matcher and @Order facts of the same method to this
  # chain. A configure(HttpSecurity) in a SecurityConfigurerAdapter or
  # AbstractHttpConfigurer subclass only adds filters and is not here.
  # Beans often inject extra parameters, and WebFlux declares
  # SecurityWebFilterChain(ServerHttpSecurity); both still own their rules.
  - id: fact.java.security_chain
    languages: [java]
    severity: INFO
    message: Spring Security filter chain
    metadata:
      fact: security_chain
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              SecurityFilterChain $M(HttpSecurity $HTTP, ...) { ... }
          - pattern: |
              SecurityWebFilterChain $M(ServerHttpSecurity $HTTP, ...) { ... }

  # The legacy configure(HttpSecurity) chain of a web or resource-server
  # adapter. Only those two bases make configure a chain; a JWT configurer
  # extends SecurityConfigurerAdapter and is applied inside a real chain.
  - id: fact.java.security_chain_adapter
    languages: [java]
    severity: INFO
    message: Spring Security adapter filter chain
    metadata:
      fact: security_chain
    patterns:
      - pattern-inside: |
          class $C extends $BASE { ... }
      - metavariable-regex:
          metavariable: $BASE
          regex: ^(WebSecurityConfigurerAdapter|ResourceServerConfigurerAdapter)$
      - pattern: |
          $RET configure(HttpSecurity $HTTP) { ... }

  # A chain's @Order. Kept separate from the method pattern so the annotation
  # can sit before or after @Bean and still be read.
  - id: fact.java.security_order
    languages: [java]
    severity: INFO
    message: Spring Security filter chain order
    metadata:
      fact: security_order
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern: '@Order($ORDER)'

  # The request scope of one chain. $OWNER is the HttpSecurity variable; the
  # resolver only uses a scope whose owner is the chain's own parameter, so
  # requestMatchers() inside an authorize lambda is a matcher, not a scope.
  # WebFlux wraps its pattern in a matcher object; unwrap the common ones.
  - id: fact.java.security_scope
    languages: [java]
    severity: INFO
    message: Spring Security filter chain request matcher
    metadata:
      fact: security_scope
    patterns:
      - pattern-either:
          - pattern: $OWNER.$SCOPE("$PATTERN")
          - pattern: $OWNER.$SCOPE(HttpMethod.$METHOD, ..., "$PATTERN", ...)
          - pattern: $OWNER.$SCOPE(..., "$PATTERN", ...)
          - pattern: $OWNER.$SCOPE(new PathPatternParserServerWebExchangeMatcher("$PATTERN"))
          - pattern: $OWNER.$SCOPE(new AntPathRequestMatcher("$PATTERN"))
          - pattern: $OWNER.$SCOPE(ServerWebExchangeMatchers.pathMatchers("$PATTERN"))
      - metavariable-regex:
          metavariable: $SCOPE
          regex: ^(securityMatcher|antMatcher|requestMatcher|requestMatchers)$

  # The legacy matcher builder: requestMatchers().antMatchers("/api/**")
  # restricts the chain itself. It has no pattern argument on
  # requestMatchers(), so the rule above cannot see it.
  - id: fact.java.security_scope_builder
    languages: [java]
    severity: INFO
    message: Spring Security matcher-builder request scope
    metadata:
      fact: security_scope
    patterns:
      - pattern: $OWNER.requestMatchers($...IGNORED).$SCOPE("$PATTERN")
      - metavariable-regex:
          metavariable: $SCOPE
          regex: ^(antMatchers|mvcMatchers|requestMatchers|pathMatchers)$
      - focus-metavariable: $PATTERN

  # The fallback of a chain: anyRequest() in the servlet DSL, anyExchange() in
  # WebFlux. Focus on the access call so the fact carries its own line.
  - id: fact.java.security_default
    languages: [java]
    severity: INFO
    message: Spring Security fallback access rule
    metadata:
      fact: security_default
    patterns:
      - pattern: $CHAIN.$DEFAULT().$ACCESS($...ARGS)
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^(anyRequest|anyExchange)$
      - metavariable-regex:
          metavariable: $ACCESS
          regex: ^(permitAll|authenticated|hasRole|hasAnyRole|hasAuthority|hasAnyAuthority|denyAll|access|fullyAuthenticated)$
      - focus-metavariable: $ACCESS

  # Class-level method security. Spraying @PreAuthorize on a whole controller is
  # common, so the resolver applies it to every method without its own gate.
  - id: fact.java.class_gate
    languages: [java]
    severity: INFO
    message: Spring class-level method security annotation
    metadata:
      fact: class_gate
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          $RET $M(...) { ... }
      - pattern-either:
          - pattern: '@$ANNOTATION("$EXPR")'
          - pattern: '@$ANNOTATION($EXPR)'
      - metavariable-regex:
          metavariable: $ANNOTATION
          regex: ^(PreAuthorize|Secured|RolesAllowed)$

  # Method-level method security: @PreAuthorize("..."), @Secured(...),
  # @RolesAllowed(...). Roles come from the expression (resolve_spring.go).
  # The pattern includes the method body so the fact's end line identifies the
  # declaration and never leaks onto an overload with the same name.
  - id: fact.java.method_gate
    languages: [java]
    severity: INFO
    message: Spring method-level security annotation
    metadata:
      fact: method_gate
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: |
              @$ANNOTATION("$EXPR")
              $RET $M(...) { ... }
          - pattern: |
              @$ANNOTATION($EXPR)
              $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $ANNOTATION
          regex: ^(PreAuthorize|Secured|RolesAllowed)$
