# Identity and credentials for Python services: who may change another person's password or
# e-mail, whether a stored password can be turned back into clear text, and secrets in logs.
rules:
  - id: scp.python.authz.credential-change-by-request-id
    languages: [python]
    message: >-
      This route changes or resets a password, PIN, e-mail or phone number for the account named
      in the URL, and the function never looks at the caller (current user, a role). Any caller
      who reaches it with any valid token can take over any account. Take the account from the
      verified token, or require an administrator role, and ask for the old password or a
      one-time code before the change.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-639", "CWE-620"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern: |
          @$APP.$M("$PATH", ...)
          def $F(...):
              ...
      - metavariable-regex:
          metavariable: $M
          regex: ^(route|put|post|patch|delete)$
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i)^(?=.*[<{]\w+)(?=.*((reset|change|update|set|new)[-_/]?(password|passwd|pwd|pin|e?-?mail|mobile|phone)|(password|passwd|pwd|pin|e?-?mail|mobile|phone)[-_/](reset|change|update)|/(password|pin|email)/?$)).*
      - pattern-not-regex: (?i)\bcurrent_user\b|\brequest\.user\b|\bg\.(user|current_user)\b|get_jwt_identity|get_current_\w+|Depends\(\s*\w*(current|admin|role|permission|owner|scope)\w*|Security\(|@\w*(admin|role|permission|owner|superuser)\w*

  - id: scp.python.crypto.recoverable-password
    languages: [python]
    message: >-
      A stored password or PIN is decrypted back to clear text. Passwords kept in a reversible
      form are all exposed at once when the database and the key leak, and every log line or
      dump that carries the stored value is as good as the password. Store a salted one-way hash
      (bcrypt, scrypt, Argon2) and compare hashes.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-257", "CWE-916"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $F(..., $O.$P, ...)
                  - pattern: $C.$F(..., $O.$P, ...)
              - metavariable-regex:
                  metavariable: $P
                  regex: (?i)^(user_?)?(password|passwd|pwd|pin)(_enc\w*|_cipher\w*)?$
          - patterns:
              - pattern-either:
                  - pattern: $F(..., $V, ...)
                  - pattern: $C.$F(..., $V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i)^(encrypted|stored|encoded|current|db|saved)_?(password|passwd|pwd|pin)$
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(decrypt|decipher)\w*$|^decode_?(password|pin)\w*$

  - id: scp.python.logging.secret-in-log
    languages: [python]
    message: >-
      A password, token, PIN, OTP or other secret is passed to a log call or print. Log lines
      reach files, log platforms and support staff; anyone who reads them can replay the token
      or use the password. Log an identifier or a masked value instead.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-532"]
      owasp: ["A09:2021 - Security Logging and Monitoring Failures"]
      confidence: MEDIUM
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $LOG.$M(..., $X, ...)
                  - pattern: $LOG.$M(..., f"...{$X}...", ...)
                  - pattern: $LOG.$M(..., <... $A + $X ...>, ...)
                  - pattern: $LOG.$M(..., $S % $X, ...)
                  - pattern: $LOG.$M(..., $S % (..., $X, ...), ...)
                  - pattern: $LOG.$M(..., $S.format(..., $X, ...), ...)
              - metavariable-regex:
                  metavariable: $LOG
                  regex: (?i)^(?:[\w]+\.)*_?(?:logging|logger|log)$
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(debug|info|warning|warn|error|exception|critical|log)$
          - patterns:
              - pattern-either:
                  - pattern: print(..., $X, ...)
                  - pattern: print(..., f"...{$X}...", ...)
              - pattern-not: print(..., file=$F, ...)
      - metavariable-regex:
          metavariable: $X
          regex: ^(?![A-Z0-9_.]+$)(?!.*(?i:fcm|push|device|page|cancel|csrf|type|expir|ttl|header))(?:\w+\.)*(?i:\w*(?:password|passwd|pwd|secret|api_?key|otp)|\w*token|pin|\w+_pin)$
