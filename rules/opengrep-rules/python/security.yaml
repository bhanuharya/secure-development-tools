rules:
  - id: scp.python.exec.eval
    languages: [python]
    message: eval() executes arbitrary code from its string argument. Remove it or use a safe parser.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-95"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: scp.python.crypto.weak-md5
    languages: [python]
    message: MD5/SHA1 are cryptographically broken. Use SHA-256 or a password hashing function such as bcrypt/argon2.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-328"]
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: scp.python.deserialization.pickle
    languages: [python]
    message: Unpickling untrusted data allows arbitrary code execution. Avoid pickle for external input.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-502"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)

  - id: scp.python.injection.command
    languages: [python]
    message: Avoid shell execution with untrusted data. Use subprocess.run with an argument list and shell=False.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-78"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)

  - id: scp.python.secrets.env-fallback-literal
    languages: [python]
    message: >-
      This secret is read from the environment with a literal fallback. When the variable is
      not set, the application starts normally with this value, and anyone who can read the
      code or the deployed files has it. Read the variable without a default so start-up fails
      when it is missing, then rotate the value.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-1188"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    # File-name patterns only: the engine matches these against the whole path, so a folder
    # pattern like **/tests/** would also switch the rule off under a parent folder of that name.
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-either:
          - pattern: os.getenv($NAME, "$VALUE")
          - pattern: os.environ.get($NAME, "$VALUE")
          - pattern: os.getenv($NAME) or "$VALUE"
          - pattern: os.environ.get($NAME) or "$VALUE"
          - pattern: os.environ.setdefault($NAME, "$VALUE")
          # python-decouple, django-environ and environs
          - pattern: decouple.config($NAME, default="$VALUE", ...)
          - pattern: $ENV.str($NAME, "$VALUE", ...)
          - pattern: $ENV.str($NAME, default="$VALUE", ...)
          - pattern: $ENV($NAME, default="$VALUE", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: >-
            (?i)^["'`]?(?=[A-Z0-9_.-]*?(?:SECRET|SALT|PASSWORD|PASSWD|(?<![A-Z0-9])PASS(?![A-Z0-9])|_PWD(?![A-Z0-9])|PRIVATE_?KEY|API_?KEY|ACCESS_?KEY|ENCRYPTION_?KEY|SIGNING_?KEY|MASTER_?KEY|APP_?KEYS|TOKEN|CREDENTIAL))(?![A-Z0-9_.-]*?_(?:TTL|EXPIRES?|EXPIRES_IN|EXPIRY|EXPIRATION|LIFETIME|MAX_AGE|DURATION|URL|URI|ENDPOINT|HOST|PORT|HEADER|NAME|TYPE|PATH|FILE|DIR|LENGTH|LEN|ALGORITHM|ALG|ISSUER|AUDIENCE|PREFIX|FIELD|COOKIE|ROUNDS|SIZE|ENABLED|REQUIRED|POLICY|REGEX|ID|MIN|MAX|FORMAT|VERSION)["'`]?$)[A-Z0-9_.-]+["'`]?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.+$
