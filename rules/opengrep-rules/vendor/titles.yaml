# Readable names for vendored rules, keyed by the id sdt reports: the
# rule's folder under rules/opengrep-rules with dots for slashes, then the
# rule's own id. The vendored files stay verbatim.
# scripts/vendor_semgrep_rules.sh rewrites vendor/semgrep but never this
# file. New upstream rules need a line here; `sdt rules verify` names the
# ones without a title.
