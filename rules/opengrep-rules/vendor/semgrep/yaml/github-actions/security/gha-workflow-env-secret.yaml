rules:
- id: gha-workflow-env-secret
  languages:
  - yaml
  message: "A GitHub Actions workflow-level env block references secrets; scope secrets to the smallest required step."
  metadata:
    category: security
    cwe:
    - "CWE-732: Incorrect Permission Assignment for Critical Resource"
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-secrets
    - https://docs.github.com/en/actions/learn-github-actions/variables#defining-environment-variables-for-a-single-workflow
    technology:
    - github-actions
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
  patterns:
  - pattern-inside: |
      env:
        ...
  - pattern-regex: '\$\{\{\s*secrets\.'
  - pattern-not-inside: 'jobs: ...'
  severity: WARNING
