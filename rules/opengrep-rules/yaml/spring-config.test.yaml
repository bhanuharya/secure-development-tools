# Annotated tests for spring-config.yaml. The engine's test mode ignores the rules' path
# filters, so the production-profile cases are exercised from this one file.
jhipster:
  cors:
    # ruleid: scp.yaml.spring.cors-any-origin-with-credentials
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "Authorization,Link,X-Total-Count"
    allow-credentials: true
    max-age: 1800
gateway:
  cors:
    # ok: scp.yaml.spring.cors-any-origin-with-credentials
    allowed-origins: "https://app.example.com"
    allow-credentials: true
public-api:
  cors:
    # ok: scp.yaml.spring.cors-any-origin-with-credentials
    allowed-origins: "*"
    allowed-methods: "GET"
    allow-credentials: false
uaa:
  # ruleid: scp.yaml.spring.prod-keystore-default-password, scp.yaml.spring.keystore-in-repository
  key-store:
    name: config/tls/keystore.p12
    # ruleid: scp.yaml.spring.prod-literal-password
    password: password
    alias: selfsigned
signing:
  # ok: scp.yaml.spring.prod-keystore-default-password
  key-store:
    name: file:/var/run/secrets/signing.p12
    password: ${SIGNING_KEYSTORE_PASSWORD}
logging:
  level:
    # ruleid: scp.yaml.spring.prod-debug-logging
    ROOT: DEBUG
    # ruleid: scp.yaml.spring.prod-debug-logging
    com.example.app: DEBUG
    # ok: scp.yaml.spring.prod-debug-logging
    io.github.jhipster: INFO
gateway-template:
  gateway:
    # ruleid: scp.yaml.spring.gateway-placeholder-access-policy
    authorized-microservices-endpoints: # Access Control Policy, if left empty for a route, all endpoints will be accessible
      app1: /api,/v2/api-docs # recommended dev configuration
gateway-listed:
  gateway:
    # ok: scp.yaml.spring.gateway-placeholder-access-policy
    authorized-microservices-endpoints:
      clientservice: /api/v1/investors/profile,/api/v1/authenticate
uaa-packaged:
  # ruleid: scp.yaml.spring.keystore-in-repository
  key-store:
    name: config/tls/signing.p12
    password: ${UAA_KEYSTORE_PASSWORD}
server:
  ssl:
    # ruleid: scp.yaml.spring.keystore-in-repository
    key-store: classpath:config/tls/keystore.p12
    # ok: scp.yaml.spring.keystore-in-repository
    trust-store: classpath:config/tls/truststore.p12
mounted:
  # ok: scp.yaml.spring.keystore-in-repository
  key-store:
    path: /var/run/secrets/tls/keystore.p12
spring:
  datasource:
    # ok: scp.yaml.spring.prod-literal-password
    password: ${DB_PASSWORD}
  mail:
    # ruleid: scp.yaml.spring.prod-literal-password
    password: example-not-a-real-mail-pass
registry:
  # ruleid: scp.yaml.spring.prod-literal-password
  password: admin
jasypt:
  # ok: scp.yaml.spring.prod-literal-password
  password: ENC(example-encrypted-value)
reset:
  # ok: scp.yaml.spring.prod-literal-password
  password-reset-url: https://app.example.com/reset
  # ok: scp.yaml.spring.prod-literal-password
  password:
management:
  endpoints:
    web:
      base-path: /management
      # ruleid: scp.yaml.spring.actuator-sensitive-endpoints
      exposure:
        include: ["configprops", "env", "health", "info", "threaddump", "logfile"]
monitoring:
  endpoints:
    web:
      # ok: scp.yaml.spring.actuator-sensitive-endpoints
      exposure:
        include: ["health", "info", "prometheus"]
listed:
  endpoints:
    web:
      # ruleid: scp.yaml.spring.actuator-sensitive-endpoints
      exposure:
        include:
          - health
          - heapdump
everything:
  endpoints:
    web:
      # ruleid: scp.yaml.spring.actuator-sensitive-endpoints
      exposure:
        include: "*"
# ruleid: scp.yaml.spring.actuator-sensitive-endpoints
management.endpoints.web.exposure.include=health,info,env
# ok: scp.yaml.spring.actuator-sensitive-endpoints
management.endpoints.web.exposure.include=health,info
oauth:
  client-authorization:
    client-id: internal
    # ruleid: scp.yaml.spring.known-default-secret
    client-secret: internal
  web-client-configuration:
    # ruleid: scp.yaml.spring.known-default-secret
    secret: changeit
  jwt:
    # ruleid: scp.yaml.spring.known-default-secret
    base64-secret: bXktc2VjcmV0LWtleS13aGljaC1zaG91bGQtYmUtY2hhbmdlZC1pbi1wcm9kdWN0aW9uLWFuZC1iZS1iYXNlNjQtZW5jb2RlZAo=
    # ok: scp.yaml.spring.known-default-secret, scp.yaml.spring.prod-literal-secret
    secret: ${JWT_SECRET}
partner:
  # ruleid: scp.yaml.spring.prod-literal-secret
  api-key: 4f9d2c7a81b34e5fa0c6d7e8
  # ruleid: scp.yaml.spring.prod-literal-secret
  client-secret: Zx81-example-not-a-default
  # ok: scp.yaml.spring.prod-literal-secret
  token-validity-in-seconds: 86400
  # ok: scp.yaml.spring.prod-literal-secret
  secret-key: ${PARTNER_SECRET_KEY}
discovery-client:
  service-url:
    # ruleid: scp.yaml.spring.service-url-embedded-credentials
    defaultZone: http://admin:${registry.password}@service-registry:8761/eureka/
    # ruleid: scp.yaml.spring.service-url-literal-credentials
    backupZone: http://admin:Example-Pass-1@service-registry:8761/eureka/
    # ok: scp.yaml.spring.service-url-embedded-credentials, scp.yaml.spring.service-url-literal-credentials
    plainZone: http://service-registry:8761/eureka/
    # ok: scp.yaml.spring.service-url-embedded-credentials
    localZone: http://admin:${registry.password}@localhost:8761/eureka/
  datasource:
    # ok: scp.yaml.spring.service-url-embedded-credentials, scp.yaml.spring.service-url-literal-credentials
    url: jdbc:oracle:thin:@10.0.0.10:1521:ORCL
edge:
  gateway:
    discovery:
      # ruleid: scp.yaml.spring.gateway-routes-every-service
      locator:
        enabled: true
        lower-case-service-id: true
tracing:
  zipkin:
    # ok: scp.yaml.spring.gateway-routes-every-service
    locator:
      discovery:
        enabled: true
explicit:
  gateway:
    discovery:
      # ok: scp.yaml.spring.gateway-routes-every-service
      locator:
        enabled: false
# ruleid: scp.yaml.spring.gateway-routes-every-service
spring.cloud.gateway.discovery.locator.enabled=true
