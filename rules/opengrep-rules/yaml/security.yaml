rules:
  - id: scp.yaml.ci.unpinned-action
    languages: [generic]
    message: GitHub Actions should be pinned to a full commit SHA instead of a mutable branch.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-1357"]
    pattern-regex: 'uses:\s+[\w\-.]+/[\w\-.]+@(main|master)\b'
