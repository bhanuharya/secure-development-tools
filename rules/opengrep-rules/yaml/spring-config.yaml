# Spring Boot and JHipster configuration files: CORS, key stores and production log levels.
# Generic matching, because the weakness is in the combination of keys, not in one value.
rules:
  - id: scp.yaml.spring.cors-any-origin-with-credentials
    languages: [generic]
    message: >-
      CORS settings allow every origin ("*") together with allow-credentials: true. Any website a
      user opens can read the API's responses through the user's browser, including hosts that
      only an office network can reach. List the real front-end origins, and leave credentials
      off when tokens travel in the Authorization header.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-942"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
    paths:
      include: ["application*.yml", "application*.yaml", "bootstrap*.yml", "bootstrap*.yaml", "application*.properties"]
    pattern-either:
      - pattern-regex: (?m)^[ \t]*allowed-origin(?:-pattern)?s:[ \t]*["']?\*["']?[ \t]*(?:#[^\n]*)?\n(?:[ \t]+[^\n]*\n){0,6}?[ \t]*allow-credentials:[ \t]*true
      - pattern-regex: (?m)^[^#\n]*cors\.allowed-origin(?:-pattern)?s[ \t]*=[ \t]*\*[ \t]*\n(?:[^\n]*\n){0,6}?[^#\n]*cors\.allow-credentials[ \t]*=[ \t]*true

  - id: scp.yaml.spring.prod-keystore-default-password
    languages: [generic]
    message: >-
      A production profile opens a key store with a default password (password, changeit,
      secret, admin). A committed key store with a default password means anyone who can read the
      repository or the image holds the key, which for a token signer means they can mint tokens.
      Load the key and its password from a secret manager and rotate the key.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-321"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: ["application-prod*.yml", "application-prod*.yaml", "application-prod*.properties", "bootstrap-prod*.yml", "bootstrap-prod*.yaml"]
    pattern-either:
      - pattern-regex: (?im)^[ \t]*(?:key-?store|trust-?store)[\w-]*:[ \t]*\n(?:[ \t]+[^\n]*\n){0,4}?[ \t]+(?:key-?store-)?password:[ \t]*["']?(?:password|changeit|secret|admin|123456)["']?[ \t]*$
      - pattern-regex: (?im)^[ \t]*(?:key-?store-password|trust-?store-password)[ \t]*[:=][ \t]*["']?(?:password|changeit|secret|admin|123456)["']?[ \t]*$
      - pattern-regex: (?im)^[^#\n]*\.(?:key-?store|trust-?store)[\w.-]*password[ \t]*=[ \t]*(?:password|changeit|secret|admin|123456)[ \t]*$

  - id: scp.yaml.spring.prod-debug-logging
    languages: [generic]
    message: >-
      A production profile sets DEBUG or TRACE logging. Request bodies, HTTP headers
      (Authorization) and SQL parameters then reach the central log store, where anyone with log
      access can replay tokens or read passwords. Use INFO or higher in production.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-532"]
      owasp: ["A09:2021 - Security Logging and Monitoring Failures"]
      confidence: HIGH
    paths:
      include: ["application-prod*.yml", "application-prod*.yaml", "application-prod*.properties", "logback-prod*.xml"]
    pattern-either:
      - pattern-regex: (?m)^[ \t]+(?:ROOT|root|[a-z][\w-]*(?:\.[\w-]+)+)[ \t]*:[ \t]*["']?(?:DEBUG|TRACE)["']?[ \t]*$
      - pattern-regex: (?m)^logging\.level\.[\w.]+[ \t]*=[ \t]*(?:DEBUG|TRACE)[ \t]*$
      - pattern-regex: <logger[^>]+level="(?:DEBUG|TRACE)"

  - id: scp.yaml.spring.gateway-placeholder-access-policy
    languages: [generic]
    message: >-
      The gateway's access-control policy (authorized-microservices-endpoints) still holds the
      generator's template entry "app1". No service is called app1, so the policy restricts
      nothing and the gateway forwards every path of every service, including internal and
      administrative APIs. List each routed service with only the paths that are meant to be
      public.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-284", "CWE-862"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: HIGH
    paths:
      include: ["application.yml", "application.yaml", "application-prod*.yml", "application-prod*.yaml", "bootstrap-prod*.yml", "bootstrap-prod*.yaml"]
      exclude: ["**/src/test/**"]
    pattern-regex: |-
      (?m)^[ \t]*authorized-microservices-endpoints[ \t]*:[^\n]*\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]+app1[ \t]*:

  - id: scp.yaml.spring.keystore-in-repository
    languages: [generic]
    message: >-
      The application loads a key store from a file inside the repository or the application
      package. Everyone who can read the repository or the image holds the private key; for a
      token signer that means they can mint valid tokens. Load the key store from a secret
      manager or a mounted secret, remove the file from the repository and rotate the key.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-321", "CWE-798"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
    paths:
      include: ["application.yml", "application.yaml", "application-prod*.yml", "application-prod*.yaml", "application.properties", "application-prod*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
      exclude: ["**/src/test/**", "application-dev*", "bootstrap-dev*"]
    pattern-either:
      - pattern-regex: |-
          (?im)^[ \t]*key-?store(?:-file|-path|-location)?[ \t]*:[ \t]*["']?(?:classpath:|file:)?(?:\./)?(?:config|src|conf|certs?|tls|ssl|keys?)/[^\s"'#]*\.(?:p12|pfx|jks|jceks|keystore)["']?[ \t]*$
      - pattern-regex: |-
          (?im)^[ \t]*key-?store:[ \t]*\n(?:[ \t]+[^\n]*\n){0,4}?[ \t]+(?:name|path|file|location)[ \t]*:[ \t]*["']?(?!file:/)(?!/)(?:classpath:)?(?:\./)?[\w.-]+/[^\s"'#]*\.(?:p12|pfx|jks|jceks|keystore)["']?
      - pattern-regex: |-
          (?im)^[^#\n]*key-?store(?:\.name|\.path|\.file|\.location)?[ \t]*=[ \t]*(?:classpath:)?(?:\./)?(?:config|src|conf|certs?|tls|ssl|keys?)/\S*\.(?:p12|pfx|jks|jceks|keystore)[ \t]*$

  - id: scp.yaml.spring.prod-literal-password
    languages: [generic]
    message: >-
      A production profile sets a password as a literal value. Everyone who can read the
      repository or the image has it, and secret scanners miss short or word-like values.
      Read it from an environment variable or a secret manager (${DB_PASSWORD}) and rotate it.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-260"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
    paths:
      include: ["application-prod*.yml", "application-prod*.yaml", "application-prod*.properties", "bootstrap-prod*.yml", "bootstrap-prod*.yaml"]
      exclude: ["**/src/test/**"]
    pattern-either:
      - pattern-regex: |-
          (?im)^[ \t]*[\w.-]*password[ \t]*:[ \t]*(?!["']?\$\{)(?!["']?ENC\()(?!["']?<)(?!["']?(?:true|false|null|~|\d+)["']?[ \t]*(?:#[^\n]*)?$)["']?[^\s"'#{}\[\]][^\s"'#]{2,}["']?[ \t]*(?:#[^\n]*)?$
      - pattern-regex: |-
          (?im)^[^#\n]*password[ \t]*=[ \t]*(?!\$\{)(?!ENC\()(?!(?:true|false|\d+)[ \t]*$)\S{3,}[ \t]*$

  - id: scp.yaml.spring.actuator-sensitive-endpoints
    languages: [generic]
    message: >-
      Actuator endpoints that reveal configuration, secrets or memory are exposed over HTTP (env,
      configprops, logfile, heapdump, threaddump, ...). env and configprops show environment
      values and the URLs of internal services, logfile shows tokens and personal data, heapdump
      and threaddump show memory. Anyone who reaches /management with a valid or stolen session
      reads them. Expose only health, info and prometheus, on a management port that is not
      routed from the internet.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-200", "CWE-215"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
    paths:
      include: ["application.yml", "application.yaml", "application-prod*.yml", "application-prod*.yaml", "application.properties", "application-prod*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
      exclude: ["**/src/test/**", "application-dev*", "bootstrap-dev*"]
    pattern-either:
      - pattern-regex: |-
          (?im)^[ \t]*exposure[ \t]*:[ \t]*\n(?:[^\n]*\n){0,3}?[ \t]+include[ \t]*:[ \t]*(?:\[[^\]\n]*["'\s,\[](?:env|configprops|logfile|heapdump|threaddump|beans|mappings|jolokia|shutdown|httptrace|sessions|gateway|\*)["'\s,\]][^\]\n]*\]|["']?\*["']?|["']?[^\n#\[]*\b(?:env|configprops|logfile|heapdump|threaddump|jolokia|shutdown|httptrace)\b)
      - pattern-regex: |-
          (?im)^[ \t]*exposure[ \t]*:[ \t]*\n(?:[^\n]*\n){0,3}?[ \t]+include[ \t]*:[ \t]*\n(?:[ \t]*-[^\n]*\n){0,20}?[ \t]*-[ \t]*["']?(?:env|configprops|logfile|heapdump|threaddump|jolokia|shutdown|httptrace|\*)["']?[ \t]*$
      - pattern-regex: |-
          (?im)^[^#\n]*management\.endpoints\.web\.exposure\.include[ \t]*[=:][ \t]*["']?(?:\*|[^\n#]*\b(?:env|configprops|logfile|heapdump|threaddump|jolokia|shutdown|httptrace)\b)

  - id: scp.yaml.spring.known-default-secret
    languages: [generic]
    message: >-
      A secret still has the value the project generator or the framework ships with. That value
      is public: anyone can sign a token with a default JWT key or get a token for a client whose
      secret is the default, without stealing anything. Generate a long random value, read it
      from an environment variable or a secret manager, and rotate what was signed or issued
      with the default.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-1392", "CWE-798"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: ["application*.yml", "application*.yaml", "application*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
      exclude: ["**/src/test/**", "application-dev*", "bootstrap-dev*", "application-test*", "application-local*"]
    pattern-regex: |-
      (?im)^[ \t]*[\w.-]*secret(?:-?key)?[ \t]*[:=][ \t]*["']?(?:internal|changeit|changeme|change-me|secret|my-secret-token-to-change-in-production|my-secret-key-which-should-be-changed-in-production-and-be-base64-encoded|bXktc2VjcmV0LWtleS13aGljaC1zaG91bGQt[A-Za-z0-9+/=]*)["']?[ \t]*(?:#[^\n]*)?$

  - id: scp.yaml.spring.prod-literal-secret
    languages: [generic]
    message: >-
      A production profile sets a client secret, signing key, API key or token as a literal
      value. Everyone who can read the repository or the image has it, and it cannot be rotated
      without a release. Read it from an environment variable or a secret manager
      (${JWT_SECRET}) and rotate it.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-321"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
    paths:
      include: ["application-prod*.yml", "application-prod*.yaml", "application-prod*.properties", "bootstrap-prod*.yml", "bootstrap-prod*.yaml"]
      exclude: ["**/src/test/**"]
    pattern-regex: |-
      (?im)^[ \t]*[\w.-]*(?:secret|secret-?key|api-?key|access-?key|private-?key|token)[ \t]*[:=][ \t]*(?!["']?\$\{)(?!["']?ENC\()(?!["']?<)(?!["']?(?:true|false|null|~|\d+)["']?[ \t]*(?:#[^\n]*)?$)(?!["']?(?:internal|changeit|changeme|change-me|secret|my-secret-token-to-change-in-production|my-secret-key-which-should-be-changed-in-production-and-be-base64-encoded|bXktc2VjcmV0LWtleS13aGljaC1zaG91bGQt[A-Za-z0-9+/=]*)["']?[ \t]*(?:#[^\n]*)?$)["']?[^\s"'#{}\[\]][^\s"'#]{2,}["']?[ \t]*(?:#[^\n]*)?$

  - id: scp.yaml.spring.service-url-literal-credentials
    languages: [generic]
    message: >-
      A service address in the configuration carries a user name and a literal password
      (scheme://user:password@host). Everyone who can read the repository has the password, and
      the address is printed in logs, error messages and the actuator endpoints without masking.
      Configure the credentials separately from a secret, and rotate the password.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-522"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: ["application*.yml", "application*.yaml", "application*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
      exclude: ["**/src/test/**", "application-dev*", "bootstrap-dev*", "application-test*", "application-local*"]
    pattern-regex: |-
      (?im)^[^#\n]*[:=][ \t]*["']?[a-z][a-z0-9+.-]*://[^\s/:@"'$]+:(?!\$\{)[^\s/@"']{3,}@[\w.$-]

  - id: scp.yaml.spring.service-url-embedded-credentials
    languages: [generic]
    message: >-
      A service address is built with the password inside it (scheme://user:${PASSWORD}@host).
      The framework masks values by key name, and the key of an address (defaultZone, uri, url)
      is not one it masks: the resolved address, password included, is shown in clear by the
      actuator env and configprops endpoints and appears in logs and error messages. Whoever
      reads one service's configuration gets the registry or broker password. Pass credentials
      in their own properties (or use mutual TLS) so the address carries none. Addresses on
      localhost are not reported.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-522", "CWE-200"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
    paths:
      include: ["application*.yml", "application*.yaml", "application*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
      exclude: ["**/src/test/**", "application-dev*", "bootstrap-dev*", "application-test*", "application-local*"]
    pattern-regex: |-
      (?im)^[^#\n]*[:=][ \t]*["']?[a-z][a-z0-9+.-]*://[^\s/:@"']+:\$\{[^}\n]+\}@(?!localhost\b|127\.0\.0\.1\b)[\w.$-]

  - id: scp.yaml.spring.gateway-routes-every-service
    languages: [generic]
    message: >-
      The gateway creates a route for every service in the registry (discovery locator). Every
      internal and administrative service becomes reachable at /services/<name>/**, and so does
      anything that registers itself: with write access to the registry, an attacker points the
      public gateway at internal hosts. Turn the locator off and define a route for each service
      that is meant to be reached, with only its public paths.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-441", "CWE-284"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
    paths:
      include: ["application.yml", "application.yaml", "application-prod*.yml", "application-prod*.yaml", "application.properties", "application-prod*.properties", "bootstrap.yml", "bootstrap-prod*.yml"]
      exclude: ["**/src/test/**"]
    pattern-either:
      - pattern-regex: |-
          (?m)^[ \t]*locator[ \t]*:[ \t]*\n(?:[ \t]*#[^\n]*\n)*[ \t]+enabled[ \t]*:[ \t]*true\b
      - pattern-regex: |-
          (?im)^[ \t]*spring\.cloud\.gateway\.discovery\.locator\.enabled[ \t]*=[ \t]*true\b
