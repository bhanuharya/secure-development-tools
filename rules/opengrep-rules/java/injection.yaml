      # A class of the application that wraps the request: what its getters for parameters, cookies,
      # headers and the query string return is request data. Its other methods are not assumed to be.
      - patterns:
          - pattern-inside: |
              $WRAPPER = new $CLASS(..., (HttpServletRequest $REQ), ...);
              ...
          - pattern: $WRAPPER.$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: (?i)^get\w*(param|cookie|header|query)\w*$
    pattern-sanitizers:
      - pattern: $ENCODER.encodeForLDAP(...)
      - pattern: $ENCODER.encodeForDN(...)
      - pattern: LdapEncoder.filterEncode(...)
      - pattern: LdapEncoder.nameEncode(...)
      - pattern: Rdn.escapeValue(...)
      # A new list, three elements added, the first removed: index 1 is then the third element. The
      # engine does not follow the shift, and would report reading that literal back.
      - patterns:
          - pattern-inside: |
              $LIST = new $LISTTYPE<$ELEMENT>();
              $LIST.add("...");
              $LIST.add($ANY);
              $LIST.add("...");
              $LIST.remove(0);
              $READ = $LIST.get(1);
          - metavariable-regex:
              metavariable: $LISTTYPE
              regex: ^(java\.util\.)?(ArrayList|LinkedList|Vector)$
          - pattern: $LIST.get(1)
    pattern-sinks:
      - pattern: (javax.naming.directory.DirContext $CTX).search(...)
      - pattern: (DirContext $CTX).search(...)
      - pattern: (javax.naming.directory.InitialDirContext $CTX).search(...)
      - pattern: (InitialDirContext $CTX).search(...)
      - pattern: (javax.naming.ldap.LdapContext $CTX).search(...)
      - pattern: (LdapContext $CTX).search(...)
      - pattern: (LdapTemplate $TEMPLATE).search(...)

  - id: scp.java.injection.xpath-from-request
