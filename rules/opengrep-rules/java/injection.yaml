  - id: scp.java.xss.request-data-in-response
    languages: [java]
    message: >-
      Data from the HTTP request is written to the response without escaping. A link can make a
      victim's browser run the attacker's script on this site. Escape the value for where it lands in
      the page first (for HTML, OWASP Java Encoder's Encode.forHtml).
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
    mode: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # What the client controls in a servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $REQ).$GETTER(...)
              - pattern: (ServletRequest $REQ).$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: ^(getParameter|getParameterMap|getParameterNames|getParameterValues|getHeader|getHeaders|getHeaderNames|getCookies|getQueryString|getInputStream|getReader|getPart|getParts|getPathInfo|getPathTranslated|getRequestURI|getRequestURL|getServletPath|getServerName|getContentType|getRequestedSessionId)$
      # A class of the application that wraps the request: what its getters for parameters, cookies,
      # headers and the query string return is request data. Its other methods are not assumed to be.
      - patterns:
          - pattern-inside: |
              $WRAPPER = new $CLASS(..., (HttpServletRequest $REQ), ...);
              ...
          - pattern: $WRAPPER.$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: (?i)^get\w*(param|cookie|header|query)\w*$
    pattern-sanitizers:
      - pattern: (PolicyFactory $POLICY).sanitize(...)
      - pattern: (AntiSamy $SCANNER).scan(...)
      - pattern: Jsoup.clean(...)
      # HTML encoders by name: OWASP Java Encoder, ESAPI, Spring HtmlUtils, commons-text, and an
      # application's own helper called the same.
      - patterns:
          - pattern: $ENCODER.$ENCODE(...)
          - metavariable-regex:
              metavariable: $ENCODE
              regex: (?i)^(forHtml\w*|encodeForHTML\w*|escapeHtml\d*|htmlEscape\w*|escapeXml\d*|htmlEncode)$
      # A new list, three elements added, the first removed: index 1 is then the third element. The
      # engine does not follow the shift, and would report reading that literal back.
      - patterns:
          - pattern-inside: |
              $LIST = new $LISTTYPE<$ELEMENT>();
              $LIST.add("...");
              $LIST.add($ANY);
              $LIST.add("...");
              $LIST.remove(0);
              $READ = $LIST.get(1);
          - metavariable-regex:
              metavariable: $LISTTYPE
              regex: ^(java\.util\.)?(ArrayList|LinkedList|Vector)$
          - pattern: $LIST.get(1)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (HttpServletResponse $RESPONSE).getWriter(...).$WRITE(...)
              - pattern: (HttpServletResponse $RESPONSE).getOutputStream(...).$WRITE(...)
              - pattern: (java.io.PrintWriter $WRITER).$WRITE(...)
              - pattern: (PrintWriter $WRITER).$WRITE(...)
              - pattern: (javax.servlet.ServletOutputStream $WRITER).$WRITE(...)
              - pattern: (ServletOutputStream $WRITER).$WRITE(...)
              - pattern: (java.io.OutputStream $WRITER).$WRITE(...)
              - pattern: (OutputStream $WRITER).$WRITE(...)
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(print|println|printf|format|write|append)$
