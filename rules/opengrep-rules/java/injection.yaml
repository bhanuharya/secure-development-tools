# Request data reaching a dangerous call in Java servlet code, one rule per weakness class, and the
# same for a method argument reaching SQL or an OS command.
#
# These replace nine upstream rules (listed in scripts/vendor_semgrep_rules.sh). Those marked the
# whole request object as untrusted, or matched on the shape of the call alone, and so reported
# about half of the safe look-alikes in OWASP Benchmark. Here only what the client controls is a
# source, and the engine's own flow analysis decides the rest: a value replaced by a constant, a
# branch that cannot run, a map entry that was never given request data are not reported.
# Measured in docs/detection.md.
#
# The sources and the list model are the same text in every rule. They are repeated, not shared
# through a YAML anchor: the scan merges all rule files into one, and falls back to loading them
# one by one (18 s slower) when a file has an anchor.
rules:
  - id: scp.java.injection.sql-from-request
    languages: [java]
    message: >-
      Data from the HTTP request reaches a SQL statement as text. A caller can change the query: read
      or alter other rows, or sign in without a password. Pass the value as a bound parameter (a ? in
      a PreparedStatement, or the template's argument list) instead of joining it into the SQL.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-89"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    mode: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # What the client controls in a servlet request.
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $REQ).$GETTER(...)
              - pattern: (ServletRequest $REQ).$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: ^(getParameter|getParameterMap|getParameterNames|getParameterValues|getHeader|getHeaders|getHeaderNames|getCookies|getQueryString|getInputStream|getReader|getPart|getParts|getPathInfo|getPathTranslated|getRequestURI|getRequestURL|getServletPath|getServerName|getContentType|getRequestedSessionId)$
      # A class of the application that wraps the request: what its getters for parameters, cookies,
      # headers and the query string return is request data. Its other methods are not assumed to be.
      - patterns:
          - pattern-inside: |
              $WRAPPER = new $CLASS(..., (HttpServletRequest $REQ), ...);
              ...
          - pattern: $WRAPPER.$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: (?i)^get\w*(param|cookie|header|query)\w*$
    pattern-sanitizers:
      - pattern: $ENCODER.encodeForSQL(...)
      # A new list, three elements added, the first removed: index 1 is then the third element. The
      # engine does not follow the shift, and would report reading that literal back.
      - patterns:
          - pattern-inside: |
              $LIST = new $LISTTYPE<$ELEMENT>();
              $LIST.add("...");
              $LIST.add($ANY);
              $LIST.add("...");
              $LIST.remove(0);
              $READ = $LIST.get(1);
          - metavariable-regex:
              metavariable: $LISTTYPE
              regex: ^(java\.util\.)?(ArrayList|LinkedList|Vector)$
          - pattern: $LIST.get(1)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Statement $STMT).$METHOD($SQL, ...)
              - pattern: (Statement $STMT).$METHOD($SQL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(execute|executeQuery|executeUpdate|executeLargeUpdate|addBatch)$
          - focus-metavariable: $SQL
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Connection $CONN).$METHOD($SQL, ...)
              - pattern: (Connection $CONN).$METHOD($SQL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(prepareStatement|prepareCall|nativeSQL)$
          - focus-metavariable: $SQL
      # Spring's JdbcTemplate. queryFor... names are its own; query, execute and update count when the
      # receiver is one by type, or by name where the type is declared in another file.
      - patterns:
          - pattern: $TEMPLATE.$METHOD($SQL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(queryForObject|queryForList|queryForMap|queryForRowSet|queryForStream|queryForInt|queryForLong)$
          - focus-metavariable: $SQL
      - patterns:
          - pattern-either:
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $TEMPLATE).$METHOD($SQL, ...)
              - pattern: (JdbcTemplate $TEMPLATE).$METHOD($SQL, ...)
              - patterns:
                  - pattern: $TEMPLATE.$METHOD($SQL, ...)
                  - metavariable-regex:
                      metavariable: $TEMPLATE
                      regex: (?i)^(.*\.)?\w*jdbc\w*template\w*$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|execute|update|batchUpdate)$
          - focus-metavariable: $SQL

  - id: scp.java.injection.sql-from-argument
    languages: [java]
    message: >-
      A method argument is joined into SQL that a Statement runs as text. If a caller ever passes user
      input, the query can be changed. Pass the value as a bound parameter, or build the statement
      from constants only.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-89"]
      owasp: ["A03:2021 - Injection"]
      confidence: LOW
    mode: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # An argument of a method that is not handed the servlet request: where the request is at hand,
      # the rule for request data follows the real input instead.
      - patterns:
          - pattern-either:
              - pattern: |
                  $RET $METHOD(..., $TYPE $ARG, ...) { ... }
              - pattern: |
                  $CLASS(..., $TYPE $ARG, ...) { ... }
          - pattern-not: |
              $RET $METHOD(..., HttpServletRequest $REQ, ...) { ... }
          - pattern-not: |
              $RET $METHOD(..., ServletRequest $REQ, ...) { ... }
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern: $ENCODER.encodeForSQL(...)
    pattern-sinks:
      - patterns:
          - pattern-not-inside: |
              $RET $HANDLER(..., HttpServletRequest $REQ, ...) { ... }
          - pattern-not-inside: |
              $RET $HANDLER(..., ServletRequest $REQ, ...) { ... }
          - pattern-either:
              - pattern: (java.sql.Statement $STMT).$METHOD($SQL, ...)
              - pattern: (Statement $STMT).$METHOD($SQL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(execute|executeQuery|executeUpdate|executeLargeUpdate|addBatch)$
          - focus-metavariable: $SQL

