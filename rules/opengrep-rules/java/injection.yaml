      LdapEncoder.filterEncode, ESAPI encodeForLDAP) or pass it as a filter argument ({0}).
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-90"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
    mode: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    pattern-sources:
      # What the client controls in a servlet request.
      - patterns:
          - pattern-either:
