    metadata:
      category: security
      cwe: ["CWE-22"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
    mode: taint
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
