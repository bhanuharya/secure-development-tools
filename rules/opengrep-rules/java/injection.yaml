          - pattern-inside: |
              $WRAPPER = new $CLASS(..., (HttpServletRequest $REQ), ...);
              ...
          - pattern: $WRAPPER.$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: (?i)^get\w*(param|cookie|header|query)\w*$
    pattern-sanitizers:
      - pattern: $ENCODER.encodeForXPath(...)
      # A new list, three elements added, the first removed: index 1 is then the third element. The
      # engine does not follow the shift, and would report reading that literal back.
      - patterns:
          - pattern-inside: |
              $LIST = new $LISTTYPE<$ELEMENT>();
              $LIST.add("...");
              $LIST.add($ANY);
              $LIST.add("...");
              $LIST.remove(0);
              $READ = $LIST.get(1);
          - metavariable-regex:
              metavariable: $LISTTYPE
              regex: ^(java\.util\.)?(ArrayList|LinkedList|Vector)$
          - pattern: $LIST.get(1)
    pattern-sinks:
      - pattern: (javax.xml.xpath.XPath $XPATH).evaluate(...)
      - pattern: (XPath $XPATH).evaluate(...)
      - pattern: (javax.xml.xpath.XPath $XPATH).compile(...)
      - pattern: (XPath $XPATH).compile(...)

