          - pattern-inside: |
              $WRAPPER = new $CLASS(..., (HttpServletRequest $REQ), ...);
              ...
          - pattern: $WRAPPER.$GETTER(...)
          - metavariable-regex:
              metavariable: $GETTER
              regex: (?i)^get\w*(param|cookie|header|query)\w*$
    pattern-sanitizers:
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
      - pattern: FilenameUtils.getName(...)
      # A new list, three elements added, the first removed: index 1 is then the third element. The
      # engine does not follow the shift, and would report reading that literal back.
      - patterns:
          - pattern-inside: |
              $LIST = new $LISTTYPE<$ELEMENT>();
              $LIST.add("...");
              $LIST.add($ANY);
              $LIST.add("...");
              $LIST.remove(0);
              $READ = $LIST.get(1);
          - metavariable-regex:
              metavariable: $LISTTYPE
              regex: ^(java\.util\.)?(ArrayList|LinkedList|Vector)$
          - pattern: $LIST.get(1)
    pattern-sinks:
      - pattern: new java.io.File(...)
      - pattern: new File(...)
      - pattern: new java.io.FileInputStream(...)
      - pattern: new FileInputStream(...)
      - pattern: new java.io.FileOutputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: new java.io.FileReader(...)
      - pattern: new FileReader(...)
      - pattern: new java.io.FileWriter(...)
      - pattern: new FileWriter(...)
      - pattern: new java.io.RandomAccessFile(...)
      - pattern: new RandomAccessFile(...)
      - pattern: java.nio.file.Paths.get(...)
      - pattern: Paths.get(...)
      - pattern: java.nio.file.Path.of(...)
      - pattern: Path.of(...)

  - id: scp.java.injection.ldap-from-request
