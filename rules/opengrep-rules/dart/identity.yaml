# Credentials in Dart and Flutter apps: secrets compiled into the app and stored passwords that
# can be decrypted.
rules:
  - id: scp.dart.secrets.hardcoded-secret
    languages: [dart]
    message: >-
      A client secret, signing key, encryption key or password is a literal in the app's code.
      Everything shipped in the app can be extracted from the package, so this value is public:
      whoever reads it can call the backend as the app or decrypt what the key protects. Keep
      secrets on the server, give the app per-user tokens, and rotate this value.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-321"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      owasp-mobile: ["M1: Improper Credential Usage"]
      confidence: MEDIUM
    paths:
      exclude: ["*_test.dart", "**/test/**", "**/integration_test/**", "*.g.dart", "*.freezed.dart"]
    pattern-regex: (?im)^[ \t]*(?:static[ \t]+)?(?:const|final|var|late[ \t]+final)?[ \t]*(?:String\??[ \t]+)?_?\w*(?:client_?secret|api_?secret|secret_?key|private_?key|jwt_?secret|signing_?key|encryption_?key|aes_?key|hmac_?key|passphrase|password)[ \t]*=[ \t]*(['"])(?!\s*\1)(?!(?:password|passwd|secret|changeme|your[-_ ]\w+|xxx+|\*+|<[^>]*>|\$\{?\w+\}?)\1)(?=[^'"\n]*\d|[^'"\n]{20,})[^'"\n$]{8,}\1[ \t]*;

  - id: scp.dart.crypto.recoverable-password
    languages: [dart]
    message: >-
      A stored password or PIN is decrypted back to clear text in the app. The key is in the app
      too, so anyone with the device storage or a backup recovers the password. Do not store the
      password: keep a revocable token in the platform key store (flutter_secure_storage) and let
      the server verify passwords against a one-way hash.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-257", "CWE-522"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      owasp-mobile: ["M9: Insecure Data Storage"]
      confidence: MEDIUM
    paths:
      exclude: ["*_test.dart", "**/test/**", "**/integration_test/**"]
    pattern-regex: (?i)\b(?:decrypt\w*|decipher\w*|decode(?:password|pin)\w*)\s*\(\s*(?:[^()\n]*\.fromBase64\(\s*)?(?:(?:\w+\.)*(?:user)?(?:password|passwd|pwd|pin)\b(?!\w)|(?:encrypted|stored|encoded|saved)(?:password|passwd|pwd|pin)\b)
