rules:
  - id: scp.kotlin.injection.command
    languages: [kotlin]
    message: Avoid Runtime.exec with untrusted input.
    severity: ERROR
    metadata:
      title: Shell command built from untrusted input
      category: security
      cwe: ["CWE-78"]
      owasp: ["A03:2021 - Injection"]
    pattern: Runtime.getRuntime().exec(...)
