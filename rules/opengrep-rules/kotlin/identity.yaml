# Credentials in Kotlin code: secrets in logs, stored passwords that can be decrypted, and
# secrets written as literals.
rules:
  - id: scp.kotlin.logging.secret-in-log
    languages: [kotlin]
    message: >-
      A password, token, PIN, OTP or other secret is written to the log. On a phone, logcat is
      readable over USB and in bug reports; on a server, log lines reach files, log platforms and
      support staff. Log an identifier or a masked value instead.
    severity: WARNING
    metadata:
      title: Secret written to a log
      category: security
      cwe: ["CWE-532"]
      owasp: ["A09:2021 - Security Logging and Monitoring Failures"]
      confidence: MEDIUM
    paths:
      exclude: ["**/src/test/**", "**/src/androidTest/**"]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $LOG.$M(..., $X, ...)
                      - pattern: $LOG.$M(..., <... $A + $X ...>, ...)
                  - metavariable-regex:
                      metavariable: $LOG
                      regex: ^(Log|Timber|log|logger|LOG|LOGGER)$
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(d|i|e|w|v|wtf|trace|debug|info|warn|error)$
              - pattern: println($X)
          - metavariable-regex:
              metavariable: $X
              regex: ^(?![A-Z0-9_.]+$)(?!.*(?i:fcm|push|device|page|cancel|csrf))(?:\w+\.)*(?:(?i:\w*(?:password|passwd|pwd|secret|apikey|api_key|otp))|token|[a-z]\w*Token|pin|[a-z]\w*Pin)$
      # String templates: "token=$token", "pin ${user.pin}".
      - pattern-regex: (?i)\b(?:Log\.[dievw]|Timber\.[dievw]|println|log(?:ger)?\.(?:trace|debug|info|warn|error))\s*\([^\n]*\$\{?(?:\w+\.)*\w*(?:password|passwd|pwd|secret|otp|(?<![a-z])pin|(?<!fcm)(?<!push)(?<!device)token)\}?(?![\w.(])

  - id: scp.kotlin.crypto.recoverable-password
    languages: [kotlin]
    message: >-
      A stored password or PIN is decrypted back to clear text. Passwords kept in a reversible
      form are all exposed at once when the storage and the key leak. Store a salted one-way
      hash (bcrypt, scrypt, Argon2) and compare hashes; on a device, do not store the password
      at all, keep a token in the platform key store.
    severity: WARNING
    metadata:
      title: Password stored in a recoverable form
      category: security
      cwe: ["CWE-257", "CWE-916"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
    paths:
      exclude: ["**/src/test/**", "**/src/androidTest/**"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $F(..., $O.$P, ...)
                  - pattern: $C.$F(..., $O.$P, ...)
              - metavariable-regex:
                  metavariable: $P
                  regex: (?i)^(user)?(password|passwd|pwd|pin)(enc\w*|cipher\w*)?$
          - patterns:
              - pattern-either:
                  - pattern: $F(..., $V, ...)
                  - pattern: $C.$F(..., $V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i)^(encrypted|stored|encoded|current|db|saved)(password|passwd|pwd|pin)$
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(decrypt|decipher)\w*$|^decode(password|pin)\w*$

  - id: scp.kotlin.secrets.hardcoded-secret
    languages: [kotlin]
    message: >-
      A client secret, API key, signing key, encryption key or password is a string literal in
      the code. Everyone who can read the repository or the built artifact has the value, and
      it cannot be rotated without a new release. Read it from the environment or a secret
      manager, and rotate this one.
    severity: ERROR
    metadata:
      title: Hard-coded secret in source code
      category: security
      cwe: ["CWE-798", "CWE-321"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
    paths:
      exclude: ["**/src/test/**", "**/src/androidTest/**"]
    # A declaration whose name ends in a secret word and whose value is a string literal.
    # The value filter drops placeholders, names of headers/fields/properties, configuration
    # and message keys, URL paths, hint text and short values, so only material meant to stay
    # private is reported.
    pattern-regex: >-
      (?m)^[ \t]*(?:(?i:private|public|protected|internal|const|override|lateinit|final|open|actual|expect)[ \t]+)*(?i:val|var)[ \t]+(?:\w*(?i:client_?secret|api_?secret|secret_?key|signing_?key|encryption_?key|aes_?key|hmac_?key|private_?key|jwt_?secret|api_?key|passphrase|password|passwd|secret)\b|\w*_(?i:token)\b|\w*Token\b)[ \t]*(?::[ \t]*(?i:String)\??[ \t]*)?=[ \t]*"(?=[^"'\n]*\d|[^"'\n]{20,})(?![^"'\n]*(?:\$\{|\$\(|%[sdv]|\{\{))(?![^"'\n]*<[^>]*>)(?!-{5}(?:BEGIN|END))(?![a-z][a-z0-9+.-]*://)(?![a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)+")(?!/[A-Za-z0-9_./{}:-]*")(?!(?i:(?:changeme|change[-_ ]?me|changeit|password|passwd|secret|token|key|your[-_ ][^"'\n]*|xxx+|x{3,}|\*+|todo|fixme|tbd|none|null|nil|undefined|example|dummy|sample|placeholder)[^"'\n]*["']))(?!(?i:/?[a-z0-9]*(?:[._/-][a-z0-9]+)*[._/-](?:secret|password|passwd|token|key)["']))(?!(?i:[a-z0-9]*(?:secret|password|passwd|token|key)["']))(?!(?i:[a-z]+(?:[ \t]+[a-z]+)+["']))[^"'\n$]{8,}"[ \t]*;?[ \t]*(?://.*)?$
