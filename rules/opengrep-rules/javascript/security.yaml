rules:
  - id: scp.javascript.injection.eval
    languages: [javascript]
    message: eval() executes arbitrary code from its string argument.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-95"]
      owasp: ["A03:2021 - Injection"]
    pattern: eval(...)

  - id: scp.javascript.xss.innerHTML
    languages: [javascript]
    message: Assigning untrusted data to innerHTML enables cross-site scripting.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
    pattern: $ELEM.innerHTML = $DATA

  - id: scp.javascript.ssrf.request-controlled-url
    languages: [javascript, typescript]
    message: >-
      The address of this outgoing request comes from the incoming HTTP request. A caller can
      make the server fetch internal addresses (cloud metadata, admin interfaces). Check the
      host against an allow-list before sending.
    severity: WARNING
    metadata:
      category: security
      cwe: ["CWE-918"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function $HANDLER($REQ, $RES, ...) { ... }
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: ($REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: "axios({..., url: $URL, ...})"
              - pattern: fetch($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: request($URL, ...)
              - pattern: request.$METHOD($URL, ...)
              - pattern: needle.$METHOD($URL, ...)
              - pattern: superagent.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: https.request($URL, ...)
          - focus-metavariable: $URL

  - id: scp.javascript.secrets.env-fallback-literal
    languages: [javascript, typescript]
    message: >-
      This secret is read from the environment with a literal fallback. When the variable is
      not set, the application starts normally with this value, and anyone who can read the
      code or the deployed files has it. Read the variable without a default so start-up fails
      when it is missing, then rotate the value.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-1188"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    # File-name patterns only: the engine matches these against the whole path, so a folder
    # pattern like **/tests/** would also switch the rule off under a parent folder of that name.
    paths:
      exclude: ["**/__tests__/**", "**/__mocks__/**", "*.spec.*", "*.example.*"]
    patterns:
      - pattern-either:
          # Strapi's config helper: env('ADMIN_JWT_SECRET', '...'), env.array('APP_KEYS', [...])
          - pattern: env($NAME, "$VALUE")
          - pattern: env.$KIND($NAME, "$VALUE")
          - pattern: env.array($NAME, [..., "$VALUE", ...])
          - pattern: process.env.$NAME || "$VALUE"
          - pattern: process.env.$NAME ?? "$VALUE"
          - pattern: process.env[$NAME] || "$VALUE"
          - pattern: process.env[$NAME] ?? "$VALUE"
          # NestJS ConfigService and similar: config.get('JWT_SECRET', '...')
          - patterns:
              - pattern: $CONFIG.get($NAME, "$VALUE")
              - metavariable-regex:
                  metavariable: $CONFIG
                  regex: (?i).*config
      - metavariable-regex:
          metavariable: $NAME
          regex: >-
            (?i)^["'`]?(?=[A-Z0-9_.-]*?(?:SECRET|SALT|PASSWORD|PASSWD|(?<![A-Z0-9])PASS(?![A-Z0-9])|_PWD(?![A-Z0-9])|PRIVATE_?KEY|API_?KEY|ACCESS_?KEY|ENCRYPTION_?KEY|SIGNING_?KEY|MASTER_?KEY|APP_?KEYS|TOKEN|CREDENTIAL))(?![A-Z0-9_.-]*?_(?:TTL|EXPIRES?|EXPIRES_IN|EXPIRY|EXPIRATION|LIFETIME|MAX_AGE|DURATION|URL|URI|ENDPOINT|HOST|PORT|HEADER|NAME|TYPE|PATH|FILE|DIR|LENGTH|LEN|ALGORITHM|ALG|ISSUER|AUDIENCE|PREFIX|FIELD|COOKIE|ROUNDS|SIZE|ENABLED|REQUIRED|POLICY|REGEX|ID|MIN|MAX|FORMAT|VERSION)["'`]?$)[A-Z0-9_.-]+["'`]?$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.+$

  - id: scp.javascript.secrets.literal-basic-credential
    languages: [javascript, typescript]
    message: >-
      A fixed user:password pair is encoded as an HTTP Basic credential in front-end code. Base64
      is an encoding, so every visitor who downloads the bundle can read the credential and call
      the backend directly. Authenticate the user to a backend, which holds the service
      credential, and rotate this one.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      exclude: ["**/__tests__/**", "**/__mocks__/**", "*.spec.*", "*.test.*", "*.min.js"]
    patterns:
      - pattern-either:
          - pattern: btoa("$CRED")
          - pattern: Buffer.from("$CRED").toString(...)
          - pattern: Buffer.from("$CRED", ...).toString(...)
      - metavariable-regex:
          metavariable: $CRED
          regex: ^[^:\s]{2,}:[^\s]{4,}$
