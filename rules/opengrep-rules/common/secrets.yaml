rules:
  - id: scp.common.secrets.aws-access-key-id
    languages: [generic]
    message: Possible AWS access key ID exposed in source code.
    severity: ERROR
    metadata:
      title: AWS access key ID committed in source
      category: security
      cwe: ["CWE-798"]
      confidence: HIGH
    pattern-regex: '\bAKIA[0-9A-Z]{16}\b'

  - id: scp.common.secrets.private-key
    languages: [generic]
    message: Private key material committed to the repository.
    severity: ERROR
    metadata:
      title: Private key material committed to the repository
      category: security
      cwe: ["CWE-798"]
      confidence: HIGH
    # The BEGIN line followed by key material, on the next line or after an escaped \n in a
    # string. The delimiter alone (code that strips it from a key loaded elsewhere) is not a key.
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----[ \t]*(?:\\n|\r?\n)[ \t]*[A-Za-z0-9+/=]{16,}'

  - id: scp.common.secrets.placeholder-default-literal
    languages: [generic]
    message: >-
      This secret placeholder has a literal default (${NAME:value}). When the property or
      variable is not set, the application runs with this value, and anyone who can read the
      code or the built artifact has it. Remove the default so start-up fails when it is
      missing, then rotate the value.
    severity: ERROR
    metadata:
      title: Secret placeholder has a literal default value
      category: security
      cwe: ["CWE-798", "CWE-1188"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: ["*.yml", "*.yaml", "*.properties", "*.java", "*.kt"]
      exclude: ["**/src/test/**", "**/src/it/**"]
    # Spring-style ${NAME:default}. Shell and Compose forms (${NAME:-x}, ${NAME:?x}), empty
    # defaults, nested placeholders and plain numbers or booleans are not matched.
    pattern-regex: >-
      \$\{(?i)(?=[\w.-]*(?:secret|password|passwd|salt|private[-_.]?key|api[-_.]?key|access[-_.]?key|signing[-_.]?key|encryption[-_.]?key|master[-_.]?key|credential|token))(?![\w.-]*[-_.](?:ttl|expires?|expires[-_.]in|expiry|expiration|validity|lifetime|duration|timeout|url|uri|endpoint|host|port|header|name|type|path|file|dir|length|algorithm|issuer|audience|prefix|enabled|required|id|format|version|location):)[\w.-]+:(?![-?=+$}\s])(?!(?:\d+|true|false)\})[^}\n]+\}

  - id: scp.common.secrets.public-build-variable
    languages: [generic]
    message: >-
      A secret-looking value is set in a public build variable. REACT_APP_, VITE_, NEXT_PUBLIC_,
      NUXT_PUBLIC_ and EXPO_PUBLIC_ values are written into the JavaScript that every visitor
      downloads. Keep the secret on a server and give the browser a short-lived, scoped token or
      a pre-signed URL instead, then rotate the value.
    severity: ERROR
    metadata:
      title: Secret value set in a public build variable
      category: security
      cwe: ["CWE-798", "CWE-200"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
    paths:
      include: [".env", ".env.*", "*.env", "Dockerfile", "Dockerfile.*", "*.yml", "*.yaml"]
      exclude: ["*.example", ".env.example", ".env.sample", ".env.template"]
    pattern-regex: (?i)\b(?:REACT_APP|VITE|NEXT_PUBLIC|NUXT_PUBLIC|EXPO_PUBLIC)_[A-Z0-9_]*(?:SECRET|PASSWORD|PASSWD|PRIVATE|ACCESS_?KEY|ACCESSKEYID|SECRETACCESSKEY|API_?KEY|CLIENT_?SECRET|TOKEN)[A-Z0-9_]*[ \t]*[:=][ \t]*["']?(?![$<{])[^\s"'#]{8,}

  - id: scp.common.secrets.credentials-in-url
    languages: [generic]
    message: >-
      An address in code or configuration carries a user name and a literal password
      (scheme://user:password@host). Everyone who can read the repository or the built artifact
      has the password, and addresses are printed in logs and error messages without masking.
      Configure the credentials separately from a secret, and rotate the password.
    severity: ERROR
    metadata:
      title: Password embedded in a connection URL
      category: security
      cwe: ["CWE-798", "CWE-522"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
    paths:
      include: ["*.js", "*.jsx", "*.mjs", "*.cjs", "*.ts", "*.tsx", "*.go", "*.py", "*.dart", "*.kt", "*.java", "*.rb", "*.php", "*.cs", "*.rs",
                ".env", ".env.*", "*.env", "*.yml", "*.yaml", "*.json", "*.toml", "*.ini", "*.conf", "*.properties", "Dockerfile", "Dockerfile.*", "*.sh"]
      exclude: ["**/src/test/**", "**/test/**", "**/tests/**", "**/__tests__/**", "*.spec.*", "*.test.*", "*_test.go", "*_test.dart", "test_*.py",
                "**/node_modules/**", "*.min.js", "package-lock.json", "*.example", ".env.example", ".env.sample", ".env.template",
                "application*.yml", "application*.yaml", "application*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
    # Placeholders and templates are left out: ${VAR}, {var}, %s, <password>, words such as
    # "password", and the hosts used in documentation.
    pattern-regex: (?i)\b(?:https?|wss?|amqps?|mqtts?|rediss?|mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|sftp|ftps?|ldaps?|nats|smtps?)://[A-Za-z0-9._%+-]{1,64}:(?![$<{\[%#]|\*{2,}|x{3,}|(?:password|passwd|pass|pwd|secret|changeme|example|user|username|token|your[-_]?\w*)(?:@|\b))[^\s/@"'`$<>{}\\]{3,}@(?!example\.|localhost\b|127\.0\.0\.1|host\b|hostname\b|server\b|\$|\{|<|%)[A-Za-z0-9.\[-]

  - id: scp.common.secrets.known-default-secret
    languages: [generic]
    message: >-
      A signing key or application secret has a well-known placeholder value (secret, changeme,
      your-256-bit-secret, ...). Anyone can sign a session or token with it, without stealing
      anything. Generate a long random value, read it from the environment or a secret manager,
      and rotate what was signed with the placeholder.
    severity: ERROR
    metadata:
      title: Signing key uses a well-known default value
      category: security
      cwe: ["CWE-1392", "CWE-798"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: [".env", ".env.*", "*.env", "docker-compose*.yml", "docker-compose*.yaml", "compose*.yml", "compose*.yaml", "values*.yml", "values*.yaml",
                "config*.yml", "config*.yaml", "config*.json", "config*.toml", "production.json", "production.yml", "production.yaml", "default.json", "appsettings*.json"]
      exclude: ["*.example", ".env.example", ".env.sample", ".env.template", ".env.test", ".env.development", ".env.dev", ".env.local", "**/test/**", "**/tests/**", "**/node_modules/**"]
    pattern-regex: |-
      (?im)^[ \t]*(?:export[ \t]+|-[ \t]+)?["']?[\w.-]*(?:(?:jwt|token|session|signing|cookie|encryption|app|auth)[_.-]?(?:secret|key)|secret(?:[_.-]?key)?)(?:[_.-]base)?["']?[ \t]*[:=][ \t]*["']?(?:secret|secretkey|secret[-_]key|my[-_]?secret(?:[-_]?key)?|your[-_]secret(?:[-_]key)?|your-256-bit-secret|changeme|change[-_]me|changeit|supersecret|super[-_]secret|s3cr3t|keyboard cat|topsecret|jwt[-_]?secret|default|123456|12345678|password)["']?[ \t]*,?[ \t]*(?:#[^\n]*)?$

  - id: scp.common.secrets.prod-literal-secret
    languages: [generic]
    message: >-
      A production configuration file in the repository sets a password, key or token as a
      literal value. Everyone who can read the repository has it, and it cannot be rotated
      without a commit. Keep production values out of the repository: inject them from the
      deployment platform's secret store, and rotate this one.
    severity: ERROR
    metadata:
      title: Literal secret in production configuration
      category: security
      cwe: ["CWE-798", "CWE-260"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
    paths:
      include: [".env.production", ".env.production.*", ".env.prod", ".env.prd", "production.env", "prod.env", "*.production.env", "*.prod.env",
                "values-prod*.yml", "values-prod*.yaml", "values.prod*.yml", "values.prod*.yaml", "values-production*.yaml", "docker-compose.prod*.yml",
                "docker-compose.prod*.yaml", "docker-compose.production*.yml", "config.prod*.yml", "config.prod*.yaml", "config.prod*.json", "config.prod*.toml",
                "config.production*.yml", "config.production*.yaml", "config.production*.json", "production.json", "production.yml", "production.yaml",
                "appsettings.Production.json"]
      exclude: ["*.example", "*.sample", "*.template"]
    pattern-regex: |-
      (?im)^[ \t]*(?:export[ \t]+|-[ \t]+)?["']?(?![\w.-]*[-_.](?:name|path|file|dir|url|uri|host|id|ttl|expir\w*|exp|algorithm|alg|header|prefix|type|endpoint|region|bucket|length|min|max|policy|enabled|required|field|param|key_?id)["']?[ \t]*[:=])[\w.-]*(?:password|passwd|secret|api[_-]?key|private[_-]?key|access[_-]?key|token|credential)[\w.-]*["']?[ \t]*[:=][ \t]*(?!["']?(?:secret|secretkey|secret[-_]key|my[-_]?secret(?:[-_]?key)?|your[-_]secret(?:[-_]key)?|your-256-bit-secret|changeme|change[-_]me|changeit|supersecret|super[-_]secret|s3cr3t|keyboard cat|topsecret|jwt[-_]?secret|default|12345678|password)["']?[ \t]*,?[ \t]*(?:#[^\n]*)?$)(?!["']?(?:\$\{|\$\(|\$[A-Za-z_]|<|\{\{|ENC\(|vault:|true\b|false\b|null\b|~|\d+["']?[ \t]*,?[ \t]*(?:#[^\n]*)?$))["']?[^\s"'#{}\[\],][^\s"'#,]{5,}["']?[ \t]*,?[ \t]*(?:#[^\n]*)?$
