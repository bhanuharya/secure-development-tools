rules:
  - id: scp.common.secrets.aws-access-key-id
    languages: [generic]
    message: Possible AWS access key ID exposed in source code.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798"]
      confidence: HIGH
    pattern-regex: '\bAKIA[0-9A-Z]{16}\b'

  - id: scp.common.secrets.private-key
    languages: [generic]
    message: Private key material committed to the repository.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798"]
      confidence: HIGH
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'

  - id: scp.common.secrets.placeholder-default-literal
    languages: [generic]
    message: >-
      This secret placeholder has a literal default (${NAME:value}). When the property or
      variable is not set, the application runs with this value, and anyone who can read the
      code or the built artifact has it. Remove the default so start-up fails when it is
      missing, then rotate the value.
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-798", "CWE-1188"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
    paths:
      include: ["*.yml", "*.yaml", "*.properties", "*.java", "*.kt"]
      exclude: ["**/src/test/**", "**/src/it/**"]
    # Spring-style ${NAME:default}. Shell and Compose forms (${NAME:-x}, ${NAME:?x}), empty
    # defaults, nested placeholders and plain numbers or booleans are not matched.
    pattern-regex: >-
      \$\{(?i)(?=[\w.-]*(?:secret|password|passwd|salt|private[-_.]?key|api[-_.]?key|access[-_.]?key|signing[-_.]?key|encryption[-_.]?key|master[-_.]?key|credential|token))(?![\w.-]*[-_.](?:ttl|expires?|expires[-_.]in|expiry|expiration|validity|lifetime|duration|timeout|url|uri|endpoint|host|port|header|name|type|path|file|dir|length|algorithm|issuer|audience|prefix|enabled|required|id|format|version|location):)[\w.-]+:(?![-?=+$}\s])(?!(?:\d+|true|false)\})[^}\n]+\}
