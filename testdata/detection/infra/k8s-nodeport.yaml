# Internal services published on a node port. A load-balancer annotation and a
# load-balancer source range only shape the cloud load balancer, so neither closes
# the node port that every node exposes.
apiVersion: v1
kind: Service
metadata:
  name: redis
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: NodePort
  ports:
    - port: 6379
      nodePort: 30379
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  type: NodePort
  loadBalancerSourceRanges:
    - 10.0.0.0/8
  ports:
    - port: 9200
      nodePort: 30920
